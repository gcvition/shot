[package]
name = "shot"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
bevy = { version = "0.19", features = ["wav"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
gpui-kit = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
lewton = "0.10"
postcard = { version = "1", features = ["alloc"] }
rand = "0.9"
rand_chacha = "0.9"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zstd = "0.14.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# Bevy 官方建议的 profile：debug 构建把依赖全开到 O3，不然 3D 视口在
# 核显上根本跑不到 60fps（帧率低 + 输入延迟高，玩起来会晕）。自身 crate
# 只开 O1，保留行表调试信息；正式发布一律 `--release`。
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
