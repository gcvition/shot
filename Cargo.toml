[package]
name = "shot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bevy = "0.19"
chrono = { version = "0.4", features = ["clock", "serde"] }
gpui-kit = "0.6"
openh264 = { version = "0.9", features = ["source"] }
postcard = { version = "1", features = ["alloc"] }
rand = "0.9"
rand_chacha = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
video-rs-encoder = ["dep:video-rs"]

[dependencies.video-rs]
version = "0.10"
optional = true
